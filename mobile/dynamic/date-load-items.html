<basis core="api" name="api.inventoryView" url="https://basisfly.com/api/inventory/packages/inventory-view/"
    method="post" content-type="application/json" run="atclient" triggers="db.inventoryViewSpecificDate" body='{
    "pid": "[##cms.query.id##]",
    "from": "{##db.inventoryViewSpecificDate.from|()##}",
    "to": "{##db.inventoryViewSpecificDate.to|()##}",
    "day": "{##db.inventoryViewSpecificDate.day|()##}",
    "pagename": "[##cms.host.pageNameInventory|(Tem1_Hotel.bc)##]",
    "dmnid": "[##cms.cms.domainid##]",
    "ownerid": "[##cms.cms.ownerid##]"
}'>
</basis>

<basis core="api" name="api.executionPlanViewDates"
    url="https://basisfly.com/api/inventory/packages/execution-plan-view/" method="post" content-type="application/json"
    run="atclient" body='{
    "pid": "[##cms.query.id##]",
    "title": "dates",
    "dmnid": "[##cms.cms.domainid##]",
    "ownerid": "[##cms.cms.ownerid##]"
}'>
</basis>




<basis core='print' run='AtClient' datamembername='db.dates' onrendered='onrenderedDates'>
    <layout>
        <script type="text/template">
        <!-- Additional required wrapper -->
        <ul>
            <!-- Slides -->
            @child
        </ul>
        </script>
    </layout>
    <face>
        <script type="text/template">
          <li class="swiper-slide cursor-pointer" onclick="renderInventoryView(this,@day@,@start.dateid@,@end.dateid@)">
            <div
                class="group/leveltwo border border-gray-50 w-[215px] bg-white rounded-lg py-4 px-6 transition-all duration-300 hover:border-primary-400">
                <h3 class="text-gray-500 font-light mb-1">تاریخ رفت و برگشت:</h3>
                <div
                    class="tour-dates text-sm font-semibold text-gray-500 transition-all duration-300 group-hover/leveltwo:text-primary-500">
                    <span class="start__date" data-date="@start.date@">@start.date@</span>
                    تا
                     <span class="end__date" data-date="@end.date@">@end.date@</span>
                </div>
            </div>
        </li>
            </script>
    </face>
</basis>
